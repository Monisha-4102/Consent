<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Interactive Site</title>

  <!-- Google Analytics (GA4) - gtag.js -->
  <!-- Replace G-XXXXXXXXXX with your Measurement ID -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-NM6KE2QF95', {
      // option: send_page_view false if you want to control page_view manually
      // 'send_page_view': false
    });

    // helper to log custom events easily
    function logEvent(name, params) {
      gtag('event', name, params || {});
      console.log('GA event:', name, params || {});
    }
  </script>

  <style>
    body { font-family: system-ui, Arial; max-width: 720px; margin: 2rem auto; padding: 1rem; }
    .card { padding: 1rem; border-radius: 8px; box-shadow: 0 0 8px rgba(0,0,0,0.06); }
    button { padding: 10px 16px; border-radius: 6px; border: none; cursor: pointer; }
    form { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Welcome — interactive demo</h1>

  <div class="card">
    <p>Click the button below to send a tracked event to Google Analytics.</p>
    <button id="magicBtn">Click me!</button>
  </div>

  <div class="card" style="margin-top: 1rem;">
    <h3>Contact (demo)</h3>
    <form id="contactForm">
      <label>
        Name:<br />
        <input name="name" type="text" required />
      </label><br/><br/>
      <label>
        Message:<br />
        <textarea name="message" required></textarea>
      </label><br/><br/>
      <button type="submit">Send</button>
    </form>
    <div id="formStatus" style="margin-top:8px;color:green;"></div>
  </div>

  <script>
    // Track button click
    document.getElementById('magicBtn').addEventListener('click', function() {
      // log a custom event in GA
      logEvent('magic_button_click', {
        label: 'magic button',
        value: 1
      });
      alert('Button clicked! Event sent to GA.');
    });

    // Track form submission
    document.getElementById('contactForm').addEventListener('submit', function(ev){
      ev.preventDefault();
      const data = {
        name: this.name.value,
        message: this.message.value
      };

      // Example: send a GA event (don't send private info)
      logEvent('contact_form_submit', {
        form_name: 'demo_contact',
        text_length: data.message.length
      });

      // fake submission UX (demo only)
      document.getElementById('formStatus').textContent = 'Thanks! (this demo does not send form to a server)';
      this.reset();
    });

    // optional: track page visibility (user switches tab)
    document.addEventListener('visibilitychange', function(){
      logEvent('page_visibility_change', { state: document.visibilityState });
    });
  </script>
</body>
</html>
