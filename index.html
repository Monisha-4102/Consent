<!DOCTYPE html>
<html lang="en">
<head>
  <script data-relyance-consent-appId="app-7698a670-84ad-5aa8-9fd0-d895334d7fe9" data-relyance-zero-fire-mode="true" src="https://consent.app.relyancestage.xyz/relyance-agent.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analytics Demo Site</title>

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    .card { padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    button { padding: 10px 15px; border: none; border-radius: 6px; background: #0070f3; color: white; cursor: pointer; }
    #consent-banner { 
      position: fixed; bottom: 0; left: 0; right: 0; 
      background: #111; color: white; padding: 15px;
      display: flex; justify-content: space-between; align-items: center;
    }
  </style>
</head>

<body>

<h1>Google Analytics Full Tracking Demo</h1>
<p>This page tracks all major GA4 interactions.</p>

<!-- CONSENT BANNER -->
<div id="consent-banner">
  <span>We use cookies for analytics. Accept?</span>
  <button onclick="acceptConsent()">Accept</button>
</div>

<!-- INTERACTIVE ELEMENTS -->
<div class="card">
  <h3>Button Click Event</h3>
  <p>Click this button to log a custom event.</p>
  <button id="magicBtn">Click Me</button>
</div>

<div class="card">
  <h3>File Download Event</h3>
  <a id="downloadLink" href="/mnt/data/Screenshot 2025-11-19 at 11.55.04 PM.png" download>Download Sample File</a>
</div>

<div class="card">
  <h3>Outbound Link Click</h3>
  <a href="https://google.com" target="_blank" id="outLink">Visit Google</a>
</div>

<div class="card">
  <h3>Contact Form</h3>
  <form id="contactForm">
    <label>Name:</label><br>
    <input type="text" name="name" required><br><br>
    <label>Message:</label><br>
    <textarea name="message" required></textarea><br><br>
    <button type="submit">Send</button>
  </form>
</div>

<!-- SCRIPT SECTION -->
<script>
  // Delay GA loading until consent
  function loadAnalytics() {
    const s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-NM6KE2QF95';
    document.head.appendChild(s);

    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.gtag = gtag;

    gtag('js', new Date());
    gtag('config', 'G-NM6KE2QF95');

    console.log("GA Loaded");

    gtag('event', 'consent_given', { method: 'banner_accept' });
  }

  function acceptConsent() {
    document.getElementById('consent-banner').style.display = 'none';
    loadAnalytics();
  }

  // Custom event tracking
  function logEvent(name, params = {}) {
    if (window.gtag) {
      gtag('event', name, params);
      console.log("Event:", name, params);
    }
  }

  // Button click tracking
  document.getElementById('magicBtn').addEventListener('click', function () {
    logEvent('magic_button_click', { button_name: 'magicBtn' });
    alert("Event sent!");
  });

  // File download tracking
  document.getElementById('downloadLink').addEventListener('click', function () {
    logEvent('file_download', { file_name: 'sample_file' });
  });

  // Outbound link tracking
  document.getElementById('outLink').addEventListener('click', function () {
    logEvent('outbound_click', { link: 'google.com' });
  });

  // Form submission tracking
  document.getElementById('contactForm').addEventListener('submit', function (e) {
    e.preventDefault();
    logEvent('contact_form_submit', { length: this.message.value.length });
    alert("Form event logged!");
    this.reset();
  });

  // Page visibility tracking
  document.addEventListener("visibilitychange", function () {
    logEvent('page_visibility_change', { state: document.visibilityState });
  });
</script>

</body>
</html>
